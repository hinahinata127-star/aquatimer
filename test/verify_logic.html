<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>AquaTimer Pro - サイクル次本LAPタイム計算検証テスト</title>
  <style>
    body { font-family: monospace; background: #060d1a; color: #fff; padding: 20px; }
    .pass { color: #10b981; margin: 4px 0; }
    .fail { color: #f43f5e; font-weight: bold; margin: 4px 0; }
    h2 { color: #00f0ff; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>AquaTimer Pro サイクル次本LAPタイム計算テスト結果</h1>
  <div id="results"></div>

  <script type="module">
    import { LaneManager } from '../js/lane-manager.js';

    const results = document.getElementById('results');
    function assert(desc, condition) {
      const p = document.createElement('div');
      if (condition) {
        p.className = 'pass';
        p.textContent = `[PASS] ${desc}`;
      } else {
        p.className = 'fail';
        p.textContent = `[FAIL] ${desc}`;
      }
      results.appendChild(p);
    }

    // 1. サイクル練習での本数別LAPタイム計算テスト
    const lm = new LaneManager();
    const lane1 = lm.lanes[0];
    const s1 = lane1.swimmers[0];

    // スタート
    lm.onMainStart();

    // 1本目: 30.00秒でLAP打刻
    s1.currentElapsed = 30000;
    const lap1 = lm.recordSwimmerLap(lane1.id, s1.id);
    assert('1本目のLap1: 区間30秒(30000ms)', lap1.lapTime === 30000);
    assert('1本目のLap1: スプリット30秒(30000ms)', lap1.splitTime === 30000);
    assert('1本目のLap1: cycleNumberは1', lap1.cycleNumber === 1);

    // サイクルリセット (2本目へ)
    // 60秒到達で2本目へ自動リセット
    s1.currentElapsed = 60000;
    lm.update(60000); // サイクルリセット発火
    assert('2本目スタート時 タイマーは0秒', s1.currentElapsed === 0);
    assert('2本目スタート時 cycleNumberは2', s1.cycleNumber === 2);

    // 2本目: 31.50秒でLAP打刻！
    s1.currentElapsed = 31500;
    const lap2 = lm.recordSwimmerLap(lane1.id, s1.id);
    assert('重要: 2本目のLap2の区間タイムは正確に31.5秒(31500ms)', lap2.lapTime === 31500);
    assert('2本目のLap2のスプリットタイムは31.5秒(31500ms)', lap2.splitTime === 31500);
    assert('2本目のLap2のcycleNumberは2', lap2.cycleNumber === 2);

    // 2本目の中でさらに100mゴール時(1分05秒)に再度LAP打刻
    s1.currentElapsed = 65000;
    const lap3 = lm.recordSwimmerLap(lane1.id, s1.id);
    assert('2本目内の2回目LAP: 区間タイムは33.5秒(65s - 31.5s = 33500ms)', lap3.lapTime === 33500);
    assert('2本目内の2回目LAP: スプリットタイムは65秒(65000ms)', lap3.splitTime === 65000);

    // 総ラップ数は3件
    assert('総ラップ数は3件保持されている', s1.laps.length === 3);

    // 2. レーン次泳者LAP切り替えテスト
    const lm2 = new LaneManager();
    const l1 = lm2.lanes[0];
    const swimmer1 = l1.swimmers[0];
    const swimmer2 = l1.swimmers[1];

    lm2.onMainStart();
    swimmer1.currentElapsed = 25000;
    swimmer2.currentElapsed = 20000;

    // 初期状態は選手1がターゲット
    assert('初期状態のアクティブ泳者は選手1', lm2.getActiveSwimmer(l1.id).id === swimmer1.id);
    assert('初期状態の次回泳者は選手2', lm2.getNextSwimmer(l1.id).id === swimmer2.id);

    // 1回目のレーンLAP打刻 ➔ 選手1が記録され、次は選手2へ切り替わる
    const res1 = lm2.recordLaneNextLap(l1.id);
    assert('1回目打刻: 記録されたのは選手1', res1.swimmer.id === swimmer1.id);
    assert('1回目打刻後: 現在のアクティブ泳者は選手2に自動切り替え', lm2.getActiveSwimmer(l1.id).id === swimmer2.id);
    assert('1回目打刻後: 次回プレビューは選手1へループ', lm2.getNextSwimmer(l1.id).id === swimmer1.id);
    assert('選手1のラップ数が1件', swimmer1.laps.length === 1);
    assert('選手2のラップ数はまだ0件', swimmer2.laps.length === 0);

    // 2回目のレーンLAP打刻 ➔ 選手2が記録され、次は選手1へ戻る
    const res2 = lm2.recordLaneNextLap(l1.id);
    assert('2回目打刻: 記録されたのは選手2', res2.swimmer.id === swimmer2.id);
    assert('2回目打刻後: 現在のアクティブ泳者は選手1に戻る', lm2.getActiveSwimmer(l1.id).id === swimmer1.id);
    assert('選手2のラップ数が1件', swimmer2.laps.length === 1);

    // 手動で選手2を指定
    lm2.setActiveSwimmer(l1.id, swimmer2.id);
    assert('手動指定後: アクティブ泳者が選手2に変更される', lm2.getActiveSwimmer(l1.id).id === swimmer2.id);

    // スキップ機能のテスト
    lm2.onMainStart();
    assert('スキップ前: アクティブは選手1', lm2.getActiveSwimmer(l1.id).id === swimmer1.id);
    const skipRes = lm2.skipSwimmer(l1.id, swimmer1.id);
    assert('スキップ実行: スキップされたのは選手1', skipRes.skippedSwimmer.id === swimmer1.id);
    assert('スキップ後: アクティブは選手2に移行', lm2.getActiveSwimmer(l1.id).id === swimmer2.id);
    assert('スキップされた選手1のラップは増えていない(0件)', swimmer1.laps.length === 0);

    // リセット時
    swimmer1.cycleNumber = 5;
    lm2.resetAll();
    assert('リセット後: アクティブ泳者が先頭の選手1に戻る', lm2.getActiveSwimmer(l1.id).id === swimmer1.id);
    assert('リセット後: 選手のcycleNumber(本数)が1に戻る', swimmer1.cycleNumber === 1);

    // 3. 本数(#)別 ＆ 1本中改行エクスポートのテスト
    import('../js/exporter.js').then(({ Exporter }) => {
      const testSession = {
        title: 'テスト計測',
        createdAt: new Date().toISOString(),
        totalElapsed: 60000,
        totalSwimmers: 1,
        lanes: [{
          laneNumber: 1,
          name: '第1レーン',
          swimmers: [{
            order: 1,
            name: 'テスト選手',
            offsetSeconds: 0,
            finalTime: 60000,
            bestLap: 15000,
            avgLap: 15000,
            laps: [
              { lapNumber: 1, cycleNumber: 1, cycleLapNumber: 1, lapTime: 15000, splitTime: 15000 },
              { lapNumber: 2, cycleNumber: 1, cycleLapNumber: 2, lapTime: 15000, splitTime: 30000 },
              { lapNumber: 3, cycleNumber: 2, cycleLapNumber: 1, lapTime: 14500, splitTime: 14500 }
            ]
          }]
        }]
      };

      const txt = Exporter.generateTextFormat(testSession);
      assert('テキスト出力に #1 が含まれる', txt.includes('#1 (本数Goal:'));
      assert('テキスト出力に #2 が含まれる', txt.includes('#2 (本数Goal:'));
      assert('テキスト出力の1本目内に L1 と L2 が改行で含まれる', txt.includes('- L1:') && txt.includes('- L2:'));

      const csv = Exporter.generateCsvFormat(testSession);
      assert('CSV出力に #1 カラムが含まれる', csv.includes('"#1"'));
      assert('CSV出力に #2 カラムが含まれる', csv.includes('"#2"'));

      console.log('All tests finished successfully.');
    });
  </script>
</body>
</html>
